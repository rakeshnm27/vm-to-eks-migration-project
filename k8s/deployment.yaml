apiVersion: apps/v1
kind: Deployment

metadata:
  name: vm-to-eks-app
  namespace: app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vm-to-eks-app

  template:
    metadata:
      labels:
        app: vm-to-eks-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: application
          image: REPLACE_WITH_ECR_IMAGE_URI

          ports:
            - containerPort: 5000
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

